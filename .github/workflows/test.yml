name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Format, Typecheck, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hi_res_meta_cleaner_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hi_res_meta_cleaner_test
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_characters
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/placeholder
      JWT_ACCESS_SECRET: build_access_secret_placeholder_32_chars
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: build_refresh_secret_placeholder_32_chars
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --include=dev
      - run: npm run build
